# CI: build and test the stdio bridge on every PR.
#
# The suite is fully offline: fetch is injected in unit tests and the CLI test points at
# 127.0.0.1:1 so it fails fast without a network. No secrets, no live Crispy call.
#
# Node is pinned to 20 and 22: 20 is the oldest line this package supports (package.json
# engines says >=18, and 20 is the oldest non-EOL release), 22 is what most users run today.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Picks the runner pool. Always GitHub-hosted so it can never get stuck queued.
  # Order: (1) a pull request from a fork NEVER gets a self-hosted pool, whatever the variables say
  # (the Lisbon runners also refuse fork jobs in a job-start hook, because a fork can edit this file);
  # (2) CI_FORCE_POOL=lisbon|boxd|github wins; (3) Lisbon if its heartbeat variable is < 300 s old;
  # (4) else CI_FALLBACK_POOL (boxd) or ubuntu-latest. Only vars, the clock and the event's repo names
  # reach this script, all through env, never through ${{ }} inside run.
  route:
    name: route runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
    steps:
      - id: pick
        env:
          HEARTBEAT: ${{ vars.LISBON_HEARTBEAT_EPOCH }}
          FORCE: ${{ vars.CI_FORCE_POOL }}
          FALLBACK: ${{ vars.CI_FALLBACK_POOL }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          now=$(date +%s)
          lisbon='["self-hosted","linux","x64","lisbon"]'
          boxd='["self-hosted","linux","boxd"]'
          gh='"ubuntu-24.04"'
          fb=$gh; [ "$FALLBACK" = "boxd" ] && fb=$boxd
          if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            pick=$gh
          elif [ -n "$FORCE" ]; then
            case "$FORCE" in lisbon) pick=$lisbon;; boxd) pick=$boxd;; *) pick=$gh;; esac
          elif [[ "$HEARTBEAT" =~ ^[0-9]+$ ]] && [ $((now - HEARTBEAT)) -lt 300 ] && [ $((now - HEARTBEAT)) -ge -60 ]; then
            pick=$lisbon
          else
            pick=$fb
          fi
          echo "heartbeat=${HEARTBEAT:-unset} now=$now head=${HEAD_REPO:-none} pick=$pick"
          echo "runs_on=$pick" >> "$GITHUB_OUTPUT"

  # Runs on the pool the route job picks (Lisbon, else the fallback). Rollback: revert this commit.
  test:
    name: build + test (node ${{ matrix.node }})
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runs_on) }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The package handles a live API key. Prove the built binary refuses to start without
      # one rather than failing later in a way a user cannot diagnose.
      - name: refuses to start without an API key
        run: |
          if node dist/index.js > /tmp/out.txt 2>&1; then
            echo "expected a non-zero exit with no API key"
            exit 1
          fi
          grep -q 'CRISPY_API_KEY' /tmp/out.txt
          grep -q 'api-key' /tmp/out.txt
